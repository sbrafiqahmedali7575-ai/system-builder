name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Build latest System Builder
        run: bun run build

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Configure Android wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rafiq.systembuilder",
            "appName": "System Builder",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Install icon renderer
        run: python3 -m pip install --quiet Pillow

      - name: Match Android launcher icon to app logo
        run: |
          cat > /tmp/icon.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              n=size*4
              img=Image.new('RGB',(n,n))
              px=img.load()
              a,b,v=(37,99,235),(79,70,229),(124,58,237)
              for y in range(n):
                  for x in range(n):
                      t=(x+y)/(2*(n-1))
                      q=t*2 if t<.5 else (t-.5)*2
                      lo,hi=(a,b) if t<.5 else (b,v)
                      px[x,y]=tuple(round(lo[i]*(1-q)+hi[i]*q) for i in range(3))
              mask=Image.new('L',(n,n),0)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,n-1,n-1),radius=round(n*.22),fill=255)
              out=Image.new('RGBA',(n,n),(0,0,0,0))
              out.paste(img,(0,0),mask)
              draw=ImageDraw.Draw(out)
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',round(n*.48))
              box=draw.textbbox((0,0),'S',font=font)
              draw.text(((n-(box[2]-box[0]))/2,(n-(box[3]-box[1]))/2-box[1]),'S',font=font,fill='white')
              out=out.resize((size,size),Image.Resampling.LANCZOS)
              folder=Path('android/app/src/main/res')/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  out.save(folder/name)
          PY
          python3 /tmp/icon.py

      - name: Build fresh-install APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk System-Builder-latest.apk
          sha256sum System-Builder-latest.apk > System-Builder-latest.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Builder-Android-latest
          path: |
            System-Builder-latest.apk
            System-Builder-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30
