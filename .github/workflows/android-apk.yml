name: Build Android APK

on:
  push:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build:web

      - name: Create Android project
        run: bunx cap add android

      - name: Sync Android project
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk System-Builder-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Builder-Android
          path: System-Builder-Android.apk
          if-no-files-found: error
          retention-days: 30
