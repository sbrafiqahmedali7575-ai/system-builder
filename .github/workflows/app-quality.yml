name: App Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Run production server smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4173
          export NODE_ENV=production
          bun run start > /tmp/system-builder-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/health.json; then
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              cat /tmp/system-builder-server.log
              exit 1
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ >/tmp/home.html
          grep -q '<div id="root"></div>' /tmp/home.html

          curl -fsS http://127.0.0.1:4173/api/auth/status >/tmp/auth-status.json
          LOGIN_REQUIRED=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/auth-status.json','utf8')); process.stdout.write(x.loginRequired ? 'true' : 'false')")

          EMPTY_STATUS=$(curl -sS -o /tmp/empty-question.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"question":""}'             http://127.0.0.1:4173/api/analytics/chat)
          WRITE_STATUS=$(curl -sS -o /tmp/write-query.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"question":"DELETE FROM day_facts","mode":"sql"}'             http://127.0.0.1:4173/api/analytics/chat)

          if [ "$LOGIN_REQUIRED" = "true" ]; then
            test "$EMPTY_STATUS" = "401"
            grep -q 'Authentication required' /tmp/empty-question.json
            test "$WRITE_STATUS" = "401"
            grep -q 'Authentication required' /tmp/write-query.json
          else
            test "$EMPTY_STATUS" = "400"
            grep -q 'Question is required' /tmp/empty-question.json
            test "$WRITE_STATUS" = "400"
            grep -q 'SQL mode is read-only' /tmp/write-query.json
          fi

          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          render_route() {
            local label="$1"
            local width="$2"
            local height="$3"
            local user_agent="$4"
            local route="$5"
            local expected="$6"
            local output="/tmp/rendered-${label}.html"
            local log="/tmp/browser-${label}.log"
            local profile="/tmp/chrome-profile-${label}"

            "$BROWSER_BIN"               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --window-size="${width},${height}"               --user-agent="$user_agent"               --user-data-dir="$profile"               --virtual-time-budget=3500               --dump-dom               "http://127.0.0.1:4173${route}" >"$output" 2>"$log"

            if ! grep -q "$expected" "$output"; then
              echo "Route ${route} failed to render expected content '${expected}' at ${width}x${height}."
              cat "$log"
              head -200 "$output"
              exit 1
            fi
          }

          DESKTOP_UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          MOBILE_UA='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'

          render_route desktop-home 1440 1000 "$DESKTOP_UA" / 'System Builder'
          render_route desktop-analytics 1440 1000 "$DESKTOP_UA" /analytics 'Data Analytics'
          render_route desktop-tools 1440 1000 "$DESKTOP_UA" /tools 'Data'
          render_route desktop-books 1440 1000 "$DESKTOP_UA" /books/cal-newport 'Cal Newport'

          render_route mobile-home 390 844 "$MOBILE_UA" / 'System Builder'
          render_route mobile-analytics 390 844 "$MOBILE_UA" /analytics 'Data Analytics'
          render_route mobile-tools 390 844 "$MOBILE_UA" /tools 'Data'
          render_route mobile-books 390 844 "$MOBILE_UA" /books/cal-newport 'Cal Newport'

          render_route narrow-home 320 568 "$MOBILE_UA" / 'System Builder'
          render_route narrow-tools 320 568 "$MOBILE_UA" /tools 'Data'
