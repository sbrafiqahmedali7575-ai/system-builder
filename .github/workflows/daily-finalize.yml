name: Daily Response Finalizer

on:
  schedule:
    # 18:40 UTC = 00:10 IST. Finalize the previous IST day after it has closed.
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v5

      - name: Finalize previous day when no response was submitted
        shell: bash
        run: |
          set -euo pipefail

          APP_BASE_URL=$(python3 -c 'import json; print(json.load(open("deployment-config.json"))["appBaseUrl"].rstrip("/"))')
          OIDC_AUDIENCE=$(python3 -c 'import json; print(json.load(open("deployment-config.json"))["oidcAudience"])')

          if [ -z "$APP_BASE_URL" ] || [ -z "$OIDC_AUDIENCE" ]; then
            echo "Error: deployment-config.json is missing appBaseUrl or oidcAudience."
            exit 1
          fi

          oidc_response=$(curl -sS --fail-with-body             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")

          scheduler_token=$(printf '%s' "$oidc_response" | python3 -c             'import json, sys; print(json.load(sys.stdin).get("value", ""))')

          if [ -z "$scheduler_token" ]; then
            echo "Error: GitHub Actions did not return an OIDC identity token."
            exit 1
          fi

          response=$(curl -sS --connect-timeout 20 --max-time 90             -w "\nHTTP_STATUS:%{http_code}"             -X POST "${APP_BASE_URL}/api/finalize-day?target=previous"             -H "Authorization: Bearer $scheduler_token"             -H "Content-Type: application/json"             --data '{"previousDay":true}')

          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)

          echo "Status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Error: Failed with status $status"
            exit 1
          fi
