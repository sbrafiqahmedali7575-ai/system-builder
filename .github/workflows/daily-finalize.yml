name: Daily Response Finalizer

on:
  schedule:
    # 18:40 UTC = 00:10 IST. Finalize the previous IST day after it has closed.
    - cron: '40 18 * * *'
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Finalize previous day when no response was submitted
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://systembuilder08.ai.studio/api/finalize-day?target=previous" \
            -H "Authorization: Bearer $SCHEDULER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"previousDay":true}')

          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)

          echo "Response: $body"
          echo "Status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Error: Failed with status $status"
            exit 1
          fi
