name: Daily Commitment Reminder (09:00 PM IST)

on:
  schedule:
    # 15:30 UTC = 21:00 IST (Asia/Kolkata) every day
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual testing from GitHub Actions tab

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CommitDaily Reminder Endpoint
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "Error: GitHub Actions secret SCHEDULER_SECRET is not configured."
            exit 1
          fi

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Reminder attempt $attempt/$max_attempts"

            response=$(curl -sS --connect-timeout 20 --max-time 90 -w "\nHTTP_STATUS:%{http_code}" -X POST https://systembuilder08.ai.studio/api/send-daily-reminder \
              -H "Authorization: Bearer $SCHEDULER_SECRET") || true

            body=$(echo "$response" | sed -e '$d')
            status=$(echo "$response" | tail -n1 | cut -d':' -f2)

            echo "Response: $body"
            echo "Status: $status"

            if [ "$status" = "200" ]; then
              echo "Reminder dispatch confirmed."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Dispatch failed. Waiting 130 seconds before retry..."
              sleep 130
            fi

            attempt=$((attempt + 1))
          done

          echo "Error: Reminder failed after $max_attempts attempts."
          exit 1
