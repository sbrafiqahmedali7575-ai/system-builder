name: System Builder Reminder Scheduler

on:
  schedule:
    # Poll every 15 minutes. The server checks the configured Asia/Kolkata
    # delivery time, the enabled switch, and persistent daily deduplication.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger System Builder Reminder Endpoint
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET GitHub Actions secret is not configured."
            exit 1
          fi

          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST https://systembuilder08.ai.studio/api/send-daily-reminder \
            -H "Authorization: Bearer $SCHEDULER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}')

          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)

          echo "Response: $body"
          echo "Status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Reminder endpoint failed with HTTP $status"
            exit 1
          fi
