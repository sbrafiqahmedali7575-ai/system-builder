name: Daily Commitment Reminder (Settings Aware)

on:
  schedule:
    # Poll every 15 minutes. The server decides whether notifications are
    # enabled and whether the configured Asia/Kolkata scheduled time is due.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CommitDaily Reminder Endpoint
        shell: bash
        run: |
          set -euo pipefail

          oidc_response=$(curl -sS --fail-with-body             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=systembuilder08.ai.studio")

          scheduler_token=$(printf '%s' "$oidc_response" | python3 -c             'import json, sys; print(json.load(sys.stdin).get("value", ""))')

          if [ -z "$scheduler_token" ]; then
            echo "Error: GitHub Actions did not return an OIDC identity token."
            exit 1
          fi

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Settings-aware reminder check $attempt/$max_attempts"

            response=$(curl -sS --connect-timeout 20 --max-time 90               -w "\nHTTP_STATUS:%{http_code}"               -X POST https://systembuilder08.ai.studio/api/send-daily-reminder               -H "Authorization: Bearer $scheduler_token") || true

            body=$(echo "$response" | sed -e '$d')
            status=$(echo "$response" | tail -n1 | cut -d':' -f2)

            echo "Status: $status"

            if [ "$status" = "200" ]; then
              echo "Reminder check completed successfully (sent, already sent, disabled, or not due)."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Dispatch failed. Waiting 130 seconds before retry..."
              sleep 130
            fi

            attempt=$((attempt + 1))
          done

          echo "Error: Reminder failed after $max_attempts attempts."
          exit 1
