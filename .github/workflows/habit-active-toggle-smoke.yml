name: Habit Active Toggle Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/habit-active-toggle-smoke.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Verify inactive habits stop HabitLogs
        run: |
          cat > habit-active-smoke.ts <<'TS'
          import { collection, getDocs } from 'firebase/firestore';
          import {
            addHabitToCloud,
            updateHabitInCloud,
            deleteHabitFromCloud,
            ensureHabitLogsForDate,
            db,
          } from './src/services/firebaseService.ts';

          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Kolkata',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).formatToParts(new Date());
          const part = (type: string) => parts.find((p) => p.type === type)?.value || '';
          const today = `${part('year')}-${part('month')}-${part('day')}`;
          const base = new Date(Date.UTC(Number(part('year')), Number(part('month')) - 1, Number(part('day'))));
          base.setUTCDate(base.getUTCDate() + 1);
          const tomorrow = [
            base.getUTCFullYear(),
            String(base.getUTCMonth() + 1).padStart(2, '0'),
            String(base.getUTCDate()).padStart(2, '0'),
          ].join('-');

          const id = `smoke-active-${Date.now()}`;
          const habit:any = {
            id,
            name: '[SMOKE] active toggle',
            emoji: '✓',
            frequency: 'daily',
            repeatDays: undefined,
            skippedDates: [],
            extraDates: [],
            color: 'blue',
            checkIns: [],
            createdAt: new Date().toISOString(),
            activeFrom: today,
            isActive: true,
            inactivePeriods: [],
          };

          const logsFor = async (dateKey: string) => {
            const snap = await getDocs(collection(db, 'habitLogs'));
            return snap.docs.filter((d) => {
              const x = d.data();
              return String(x.habitId || '') === id && String(x.dateKey || '') === dateKey;
            });
          };

          try {
            await addHabitToCloud(habit);

            await updateHabitInCloud({ ...habit, isActive: false });
            await ensureHabitLogsForDate(tomorrow);

            const inactiveTomorrowLogs = await logsFor(tomorrow);
            if (inactiveTomorrowLogs.length !== 0) {
              throw new Error(`Inactive habit created ${inactiveTomorrowLogs.length} HabitLog(s) for tomorrow`);
            }
            console.log('PASS :: inactive habit created no future HabitLog');

            await updateHabitInCloud({ ...habit, isActive: true });
            await ensureHabitLogsForDate(tomorrow);

            const activeTomorrowLogs = await logsFor(tomorrow);
            if (activeTomorrowLogs.length !== 1) {
              throw new Error(`Re-enabled habit expected 1 log, got ${activeTomorrowLogs.length}`);
            }
            if (activeTomorrowLogs[0].data().Iscompleted !== false) {
              throw new Error('Re-enabled due habit should start with Iscompleted=false');
            }
            console.log('PASS :: re-enabled habit resumed with one false HabitLog');
          } finally {
            await deleteHabitFromCloud(id);
          }
          TS

          bun habit-active-smoke.ts
          rm -f habit-active-smoke.ts
