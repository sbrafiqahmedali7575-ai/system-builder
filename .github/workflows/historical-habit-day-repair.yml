name: Historical Habit Day Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-habit-day-repair.yml'

permissions:
  contents: read

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Audit and repair historical Days habit metrics
        run: |
          cat > historical-habit-day-repair.ts <<'TS'
          import {
            collection,
            doc,
            getDocs,
            setDoc,
          } from 'firebase/firestore';
          import { db } from './src/services/firebaseService.ts';

          type Row = Record<string, unknown>;

          const normalizeDateKey = (value: unknown): string => {
            const raw = String(value ?? '').trim();
            const match = raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
            if (!match) return '';
            return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
          };

          const todayParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Kolkata',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).formatToParts(new Date());
          const part = (type: string) =>
            todayParts.find((item) => item.type === type)?.value || '';
          const today = `${part('year')}-${part('month')}-${part('day')}`;

          const isHabitDue = (habit: Row, dateKey: string): boolean => {
            if (habit.isActive === false) return false;

            const activeFrom = normalizeDateKey(habit.activeFrom) || '1970-01-01';
            if (dateKey < activeFrom) return false;

            const repeatDays = Array.isArray(habit.repeatDays)
              ? habit.repeatDays
                  .map((value) => Number(value))
                  .filter(
                    (value) =>
                      Number.isInteger(value) && value >= 0 && value <= 6
                  )
              : [];

            const [year, month, day] = dateKey.split('-').map(Number);
            const weekday = new Date(
              Date.UTC(year, month - 1, day)
            ).getUTCDay();

            return repeatDays.includes(weekday);
          };

          const roundedRate = (completed: number, total: number): number =>
            total > 0
              ? Math.round((completed / total) * 10000) / 100
              : 0;

          const [daysSnap, habitsSnap, logsSnap] = await Promise.all([
            getDocs(collection(db, 'days')),
            getDocs(collection(db, 'habits')),
            getDocs(collection(db, 'habitLogs')),
          ]);

          const habits = habitsSnap.docs.map((habitDoc) => ({
            id: String(habitDoc.data().habitId || habitDoc.id),
            data: habitDoc.data() as Row,
          }));

          const logsByDate = new Map<
            string,
            Array<{ habitId: string; completed: boolean }>
          >();

          logsSnap.forEach((logDoc) => {
            const data = logDoc.data();
            const dateKey = normalizeDateKey(data.dateKey);
            if (!dateKey || dateKey >= today) return;

            const habitId = String(data.habitId || '');
            if (!habitId) return;

            const rows = logsByDate.get(dateKey) || [];
            rows.push({
              habitId,
              completed: data.Iscompleted === true,
            });
            logsByDate.set(dateKey, rows);
          });

          const dayByDate = new Map(
            daysSnap.docs.map((dayDoc) => [
              normalizeDateKey(dayDoc.data().dateKey || dayDoc.id),
              {
                ref: dayDoc.ref,
                data: dayDoc.data() as Row,
              },
            ])
          );

          const auditedDates = [...logsByDate.keys()].sort();
          const stale: Array<{
            dateKey: string;
            beforeCompleted: number;
            expectedCompleted: number;
            beforeRate: number;
            expectedRate: number;
            expectedTotal: number;
            beforeIsdayCompleted: boolean;
            expectedIsdayCompleted: boolean;
          }> = [];

          for (const dateKey of auditedDates) {
            const day = dayByDate.get(dateKey);
            const completedHabitIds = new Set(
              (logsByDate.get(dateKey) || [])
                .filter((log) => log.completed)
                .map((log) => log.habitId)
            );

            const dueHabits = habits.filter((habit) =>
              isHabitDue(habit.data, dateKey)
            );
            const expectedTotal = dueHabits.length;
            const expectedCompleted = dueHabits.filter((habit) =>
              completedHabitIds.has(habit.id)
            ).length;
            const expectedRate = roundedRate(
              expectedCompleted,
              expectedTotal
            );

            const currentCompleted = Number(
              day?.data.habitsCompleted || 0
            );
            const currentRate = Number(
              day?.data.habitCompletionRate || 0
            );
            const taskRate = Number(
              day?.data.taskCompletionRate || 0
            );
            const expectedIsdayCompleted =
              taskRate * 0.8 + expectedRate * 0.2 >= 80;
            const currentIsdayCompleted =
              day?.data.IsdayCompleted === true;

            const isStale =
              !day ||
              currentCompleted !== expectedCompleted ||
              Math.abs(currentRate - expectedRate) > 0.001 ||
              currentIsdayCompleted !== expectedIsdayCompleted;

            if (!isStale) continue;

            stale.push({
              dateKey,
              beforeCompleted: currentCompleted,
              expectedCompleted,
              beforeRate: currentRate,
              expectedRate,
              expectedTotal,
              beforeIsdayCompleted: currentIsdayCompleted,
              expectedIsdayCompleted,
            });

            await setDoc(
              doc(db, 'days', dateKey),
              {
                dateKey,
                habitsCompleted: expectedCompleted,
                habitTotal: expectedTotal,
                habitCompletionRate: expectedRate,
                IsdayCompleted: expectedIsdayCompleted,
              },
              { merge: true }
            );
          }

          console.log(
            'AUDIT_SUMMARY=' +
              JSON.stringify({
                today,
                habitLogs: logsSnap.size,
                historicalDatesWithHabitLogs: auditedDates.length,
                staleDatesFound: stale.length,
                repairedDates: stale.length,
              })
          );

          for (const item of stale) {
            console.log('REPAIRED_DATE=' + JSON.stringify(item));
          }

          // Verify every repaired row after writes.
          let verificationFailures = 0;
          const refreshedDays = await getDocs(collection(db, 'days'));
          const refreshedByDate = new Map(
            refreshedDays.docs.map((dayDoc) => [
              normalizeDateKey(dayDoc.data().dateKey || dayDoc.id),
              dayDoc.data() as Row,
            ])
          );

          for (const item of stale) {
            const row = refreshedByDate.get(item.dateKey);
            if (
              !row ||
              Number(row.habitsCompleted || 0) !== item.expectedCompleted ||
              Math.abs(
                Number(row.habitCompletionRate || 0) - item.expectedRate
              ) > 0.001 ||
              (row.IsdayCompleted === true) !== item.expectedIsdayCompleted
            ) {
              verificationFailures += 1;
              console.log(
                'VERIFY_FAIL=' +
                  JSON.stringify({
                    dateKey: item.dateKey,
                    row,
                    expected: item,
                  })
              );
            }
          }

          console.log(
            'VERIFY_SUMMARY=' +
              JSON.stringify({
                repairedDates: stale.length,
                verificationFailures,
              })
          );

          if (verificationFailures > 0) process.exitCode = 1;
          TS

          bun historical-habit-day-repair.ts
          rm -f historical-habit-day-repair.ts
